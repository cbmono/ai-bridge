name: Tests

# Runs the tests/*.test.sh suite so a head can be verified without a human or an
# agent session — ai-bridge-v4/task-001. Fires on every PR against the default branch
# and on every push that lands on it, so main itself always carries its own signal.
#
# ONE deliberate scope cut: a PR whose every changed path lives under plugin/ or
# .claude-plugin/ cannot touch the machinery the other 59 harnesses test, so it runs
# ONLY the two plugin harnesses — same job, same required-check name, same
# per-harness verification — instead of paying the full ~15-minute suite. The rule is
# strict on purpose: ONE path outside those two directories (a README line, a test
# edit, anything) and the full suite runs. Pushes to main always run everything.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    # STABLE, enumerable check name — referenced verbatim by
    # .github/required-checks.txt and by scripts/required-checks.sh. Renaming this job
    # is a merge-gate change: update the declared name in the same commit.
    name: harness suite
    # macos-latest, not ubuntu-latest: this suite has never had CI, and a first real
    # run on Linux turned up FOUR harnesses (deliverable-paths-vs-yaml, migrate-bundle,
    # push-state, reclaim-worktree) failing for reasons that look environment-specific
    # (GNU vs BSD tool behaviour, a different YAML oracle, PATH/root-permission
    # differences) rather than defects — on top of the one known, already-fixed-in-#41
    # failure. This repo's own tests are heavily macOS-authored (BSD stat, macOS
    # mktemp/symlink quirks, decomposed-filename handling are all named explicitly in
    # tests/*.test.sh), so macOS is the platform its baseline was actually measured on.
    # Investigating and fixing each Linux-specific gap is real work belonging to its
    # own task, not silently absorbed into "wire up CI" — see the PR body.
    runs-on: macos-latest
    permissions:
      contents: read
    # One harness alone measures ~7 minutes and the full suite several more on top of
    # that; this is a generous ceiling, not the measured number (see the PR body for
    # the measured wall-clock).
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The plugin-only scope check diffs against the PR base; 0 keeps it able to.
          fetch-depth: 0

      - name: Run tests/*.test.sh
        shell: bash
        run: |
          set -uo pipefail

          export TMPDIR="${RUNNER_TEMP:-/tmp}"
          mkdir -p "$TMPDIR"

          workspace="$GITHUB_WORKSPACE"

          # A harness with a broken TMPDIR guard can rm -rf its OWN checkout while
          # still printing a clean "pass=N fail=0" and exiting 0 — see
          # knowledge/findings/suite-cleanup-can-delete-its-own-checkout.md in the
          # control panel that manages this repo. So neither the exit code nor the
          # reported tally is trusted alone, and this re-verifies the checkout itself
          # is still intact after every single harness, stopping immediately (not
          # limping through the rest of the loop) the moment it is not.
          verify_checkout() {
            git -C "$workspace" rev-parse --verify -q HEAD >/dev/null 2>&1 \
              && [ -d "$workspace/.git" ] \
              && [ -d "$workspace/tests" ] \
              && [ -d "$workspace/plugin" ]
          }

          verify_checkout || {
            echo "::error::checkout is not intact before the suite even started"
            exit 2
          }

          shopt -s nullglob
          files=(tests/*.test.sh)
          shopt -u nullglob

          # ---- the plugin-only fast path (see the header comment) -------------------
          # PRs only; a push to main always runs the full suite. The diff is against
          # the PR base, and the verdict FAILS TOWARD THE FULL SUITE: an empty diff,
          # a failed fetch, or any path outside plugin/ and .claude-plugin/ keeps
          # every harness. The one harness the fast path runs goes through exactly
          # the same loop, checkout verification and pass/fail parsing below.
          if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ] && [ -n "${GITHUB_BASE_REF:-}" ]; then
            if git fetch --quiet origin "$GITHUB_BASE_REF"; then
              changed="$(git diff --name-only "origin/$GITHUB_BASE_REF"...HEAD)"
              if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qvE '^(plugin/|\.claude-plugin/)'; then
                echo "plugin-only diff — running the plugin harnesses only:"
                printf '%s\n' "$changed" | sed 's/^/  /'
                # plugin-eval is on this list because the eval SUITE lives under
                # plugin/evals/ — a plugin-only PR editing a case would otherwise
                # change the eval and never run it. It self-skips loudly where the
                # CLI has `plugin eval` gated off, which is every hosted runner today.
                # deny-baseline and agent-control are on this list because the two
                # enforcement HOOKS now live under plugin/ (ai-bridge-v2/task-003).
                # Without them a plugin-only PR editing a hook would skip the 283
                # assertions that are the only proof either one still fires.
                files=(tests/plugin-manifest.test.sh tests/plugin-skills.test.sh tests/plugin-agents.test.sh tests/plugin-eval.test.sh tests/deny-baseline.test.sh tests/agent-control.test.sh)
              fi
            fi
          fi
          # ---------------------------------------------------------------------------

          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no tests/*.test.sh files found — refusing to report a vacuous pass"
            exit 2
          fi

          total_pass=0
          total_fail=0
          bad=()
          start_ts=$(date +%s)

          for f in "${files[@]}"; do
            echo "::group::$f"
            # Captured through an if, never off a bare \$?: this step's default shell
            # runs with -e, and a bare failing assignment would abort the loop before
            # the checkout-integrity re-check below ever ran.
            if out="$(bash "$f" 2>&1)"; then rc=0; else rc=$?; fi
            printf '%s\n' "$out"
            echo "::endgroup::"

            if ! verify_checkout; then
              echo "::error::the checkout was destroyed while running $f — stopping immediately. See knowledge/findings/suite-cleanup-can-delete-its-own-checkout.md in the control panel."
              exit 2
            fi

            # Exit codes are not trusted on their own: a harness can print a clean
            # tally and exit 0 while it has just destroyed its checkout, or print
            # nothing parseable at all. Both are treated as failures here. Two
            # conventions are in use across tests/*.test.sh (.claude/rules/tests.md
            # names both: "pass=/fail=" or "N passed, N failed") — both are tried,
            # in order, and only their absence counts as "no summary".
            summary="$(printf '%s\n' "$out" | grep -oE 'pass=[0-9]+ fail=[0-9]+' | tail -n1 || true)"
            style=dense
            if [ -z "$summary" ]; then
              summary="$(printf '%s\n' "$out" | grep -oE '[0-9]+ passed, [0-9]+ failed' | tail -n1 || true)"
              style=prose
            fi
            if [ -z "$summary" ]; then
              echo "::error::$f exited $rc but printed no recognised pass/fail summary — the exit code alone is never trusted here"
              bad+=("$f (no summary, exit $rc)")
              continue
            fi

            if [ "$style" = dense ]; then
              f_pass="$(printf '%s' "$summary" | sed -E 's/pass=([0-9]+).*/\1/')"
              f_fail="$(printf '%s' "$summary" | sed -E 's/.*fail=([0-9]+)/\1/')"
            else
              f_pass="$(printf '%s' "$summary" | sed -E 's/^([0-9]+) passed.*/\1/')"
              f_fail="$(printf '%s' "$summary" | sed -E 's/.*, ([0-9]+) failed$/\1/')"
            fi
            total_pass=$((total_pass + f_pass))
            total_fail=$((total_fail + f_fail))

            if [ "$rc" -ne 0 ] || [ "$f_fail" -ne 0 ]; then
              echo "::error::$f — exit=$rc reported fail=$f_fail"
              bad+=("$f (exit $rc, fail=$f_fail)")
            fi
          done

          end_ts=$(date +%s)
          echo "== ${#files[@]} harness(es) in $((end_ts - start_ts))s — pass=$total_pass fail=$total_fail =="

          if [ "${#bad[@]}" -gt 0 ]; then
            echo "FAILED harnesses:"
            printf '  - %s\n' "${bad[@]}"
            exit 1
          fi

          echo "ok: all ${#files[@]} harnesses passed — exit code AND reported fail=0 both verified for each"

      # ai-bridge-v4/task-022: `--check` re-asks github.com's own Markdown endpoint what it
      # does with each recorded body and diffs the answer against
      # tests/fixtures/reviewer/host-rendering.txt. Before this step it could only be run by
      # hand, which meant it would not be run — this makes renderer drift visible on every
      # PR and push instead of invisible until someone thinks to look.
      #
      # NOT gated on: this repo's ONE required check is this job (`harness suite`,
      # .github/required-checks.txt), and github.com's Markdown rendering is not something
      # this repo controls — a wording change on the host's side is real (see
      # docs/conventions.md, "the host wins and it is recorded") and would otherwise block
      # every PR until someone re-records the oracle. So this step is allowed to fail
      # without failing the job; the annotation still surfaces the drift, and re-recording
      # (`tests/fixtures/reviewer/record-host-rendering.sh`, no flag) plus a review of the
      # diff is the human follow-up.
      - name: Check the recorded host-rendering oracle against github.com's live renderer
        shell: bash
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if tests/fixtures/reviewer/record-host-rendering.sh --check; then
            echo "ok: host-rendering.txt still matches github.com's renderer"
          else
            echo "::warning::tests/fixtures/reviewer/host-rendering.txt is STALE — github.com's Markdown renderer now answers at least one recorded case differently. Re-run tests/fixtures/reviewer/record-host-rendering.sh, review the diff, and commit the refreshed fixture."
          fi

# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
#
# One review per PR, then done.
#
# Rationale: PRs here are agent-authored and land pre-reviewed (self-review, the test
# suite), so CodeRabbit's job is a single fresh-context pass. Its findings get fixed in
# follow-up pushes — and a re-review of those fixes reliably finds nothing while costing a
# full session. Defaults re-run the review on every push AND reply to every comment, which
# turned one useful review into many empty ones.
#
# This file is also the worked example the docs point at: `docs/autonomy.md` tells you to
# pin the same two keys in each TARGET repo's own `.coderabbit.yaml`, because that is where
# the agent-authored PRs land.
#
# Every key below overrides a default that is `true`; see
# https://docs.coderabbit.ai/reference/configuration
# Validate keys against the schema URL above before editing — don't invent keys.
reviews:
  auto_review:
    enabled: true
    # "Re-run the review on each push." This is the main cost lever: with it off,
    # a PR is reviewed once, when it opens. Push fixes freely — no re-review.
    # Need another pass after a substantial rewrite? Ask for it explicitly with an
    # `@coderabbitai review` comment.
    auto_incremental_review: false
    # Draft PRs aren't reviewed (already the default, pinned so the "review fires
    # once, when the PR is marked ready" contract is explicit): open as a draft
    # while iterating, and the single review lands on `ready for review`.
    drafts: false
  # Don't narrate the diff back at us in prose+mermaid — the walkthrough and
  # high-level summary already cover it. (This is not about shell dialect: this
  # repo's `tests/**` harnesses are bash, not POSIX sh — see path_instructions
  # below, which is the fact a reviewer should act on instead of inferring one
  # from this comment.)
  sequence_diagrams: false
  # FACT, not preference: every `*.sh` under `tests/` — the whole scope declared
  # below, at any depth and whatever the filename suffix — starts with exactly
  # `#!/usr/bin/env bash` and uses bash-only constructs (`pipefail`, `local`,
  # process substitution), and none is ever invoked via `sh`. Census:
  # `find tests -name '*.sh' -exec head -1 {} \; | sort | uniq -c` — see the PR
  # that added this line for the exact run. Bash is the standard here; do not
  # ask for a POSIX `sh` rewrite of anything under `tests/`.
  # `tests/harness-shell-dialect.test.sh` keeps this comment honest: it scans
  # exactly the glob below, fails on any file whose first line is not that
  # shebang, and fails if the glob here and the one it scans stop matching.
  path_instructions:
    - path: "tests/**/*.sh"
      instructions: >
        These are bash harnesses, not POSIX sh: every one carries a
        `#!/usr/bin/env bash` shebang and relies on bash-only constructs
        (`pipefail`, `local`, process substitution). None is ever invoked via
        `sh`. Bash is this repo's declared standard for `tests/**` — do not
        raise a finding asking for POSIX `sh` compatibility or a `dash -n`
        pass here; that guideline does not apply to this path.
chat:
  # "Let CodeRabbit reply automatically without requiring a mention/tag."
  # On (the default) every comment in a review thread wakes the bot up — including
  # our own "fixed in <sha>" notes, which need no reply. Off, it answers only when
  # actually asked via `@coderabbitai`.
  auto_reply: false
